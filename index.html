<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rapport photo - Caméra</title><style>body{font-family:Arial,sans-serif;background:#f3f4f6;margin:0;padding:12px}.app{max-width:760px;margin:auto;background:#fff;padding:16px;border-radius:12px}h1{text-align:center}.box{padding:12px;border:1px solid #d1d5db;border-radius:10px;margin:12px 0}label{display:block;font-weight:bold;margin:8px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px}textarea{min-height:72px}button{padding:12px;border:0;border-radius:8px;font-weight:bold;cursor:pointer;margin:4px 0}.blue{background:#1565c0;color:#fff;width:100%}.green{background:#07875d;color:#fff;width:100%}.pdf{background:#b91c1c;color:#fff;width:100%}.secondary{background:#e7edf5;color:#17212b;width:100%}#cameraBox,#editor{display:none}.camera{background:#111;border-radius:8px;overflow:hidden}.camera video{display:block;width:100%;max-height:65vh;object-fit:cover}.camera-tools,.tools,.exports{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.tools button{background:#e7edf5}.tools .active{background:#1565c0;color:#fff}.image{background:#111}.image canvas{display:block;width:100%;touch-action:none}.card{display:grid;grid-template-columns:90px 1fr auto;gap:10px;border:1px solid #dbe1e7;border-radius:8px;padding:8px;margin:8px 0}.card img{width:90px;height:72px;object-fit:cover}.card small{display:block;margin-top:5px;color:#475569}.del{background:#fee2e2;color:#b91c1c}.hint{font-size:.85em;color:#64748b}.badge{display:inline-block;padding:4px 8px;border-radius:6px;font-weight:bold;font-size:.85em}.bad{background:#fee2e2;color:#b91c1c}.good{background:#dcfce7;color:#15803d}</style></head><body><main class="app"><h1>📸 Rapport photo</h1><div class="box"><label>Titre du rapport</label><input id="reportTitle" placeholder="Ex. Contrôle installation piscine"><label>Date du rapport</label><input id="reportDate" type="date"></div><button class="blue" id="openCamera">📷 Ouvrir l’appareil photo</button><button class="secondary" id="choosePhoto">🖼️ Choisir une photo de la galerie</button><input id="file" type="file" accept="image/*" style="position:absolute;left:-9999px"><section id="cameraBox" class="box"><div class="camera"><video id="video" autoplay playsinline muted></video></div><div class="camera-tools"><button class="green" id="capture">● Prendre la photo</button><button class="secondary" id="closeCamera">Fermer</button></div></section><section id="editor" class="box"><div class="image"><canvas id="canvas"></canvas></div><div class="tools"><button id="cross">✚ Croix rouge</button><button id="circle">◯ Cercle rouge</button><button id="undo">↶ Annuler</button><button id="clear">🗑 Effacer tout</button></div><label>Commentaire pour cette photo</label><textarea id="comment" placeholder="Ex. Fuite constatée sur le raccord, réparation à prévoir."></textarea><label>Action</label><select id="action"><option value="A corriger">⚠️ A corriger</option><option value="Corrigé">✅ Corrigé</option></select><button class="green" id="add">✅ Ajouter cette photo au rapport</button></section><section id="list"><p class="hint">Aucune photo ajoutée.</p></section><div class="exports" id="exports" style="display:none"><button class="green" id="exportXlsx">📊 Excel</button><button class="pdf" id="exportPdf">📄 PDF stylisé</button></div><p class="hint">Important : pour ouvrir directement la caméra, cette page doit être hébergée en HTTPS (GitHub Pages, Netlify, etc.). Un fichier HTML ouvert localement ne peut pas accéder à la caméra sur la plupart des téléphones.</p></main><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script>(()=>{const $=x=>document.getElementById(x),c=$('canvas'),x=c.getContext('2d'),video=$('video');let img,marks=[],mode,start,draft,photos=[],stream=null;$('reportDate').value=new Date().toISOString().slice(0,10);async function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;$('cameraBox').style.display='none'}$('openCamera').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){alert('La caméra directe n’est pas prise en charge ici. Utilisez « Choisir une photo ».');return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.srcObject=stream;$('cameraBox').style.display='block';$('cameraBox').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){alert('Accès caméra refusé ou impossible. Autorisez la caméra dans le navigateur. Si le fichier est ouvert localement, hébergez-le en HTTPS, puis réessayez.')} };$('closeCamera').onclick=stopCamera;$('capture').onclick=()=>{if(!video.videoWidth)return;let tmp=document.createElement('canvas');tmp.width=video.videoWidth;tmp.height=video.videoHeight;tmp.getContext('2d').drawImage(video,0,0);loadData(tmp.toDataURL('image/jpeg',.9));stopCamera()};$('choosePhoto').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>loadData(r.result);r.readAsDataURL(f);e.target.value=''};function loadData(src){img=new Image;img.onload=()=>{let r=Math.min(1,1600/img.width);c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);marks=[];draw();$('editor').style.display='block';$('editor').scrollIntoView({behavior:'smooth',block:'start'})};img.src=src}function p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function mark(m){x.strokeStyle='#e00000';x.lineWidth=Math.max(5,c.width/150);if(m.t==='o'){x.beginPath();x.arc(m.a,m.b,Math.hypot(m.d-m.a,m.e-m.b),0,7);x.stroke()}else{let s=Math.max(Math.abs(m.d-m.a),Math.abs(m.e-m.b)),a=m.d>=m.a?m.a:m.a-s,b=m.e>=m.b?m.b:m.b-s;x.beginPath();x.moveTo(a,b);x.lineTo(a+s,b+s);x.moveTo(a+s,b);x.lineTo(a,b+s);x.stroke()}}function draw(){if(!img)return;x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);marks.forEach(mark);if(draft)mark(draft)}function set(m){mode=m;$('cross').classList.toggle('active',m==='x');$('circle').classList.toggle('active',m==='o')}$('cross').onclick=()=>set(mode==='x'?null:'x');$('circle').onclick=()=>set(mode==='o'?null:'o');$('undo').onclick=()=>{marks.pop();draw()};$('clear').onclick=()=>{marks=[];draw()};c.onpointerdown=e=>{if(mode){start=p(e);c.setPointerCapture?.(e.pointerId)}};c.onpointermove=e=>{if(start){let q=p(e);draft={t:mode,a:start.x,b:start.y,d:q.x,e:q.y};draw()}};c.onpointerup=()=>{if(draft)marks.push(draft);start=draft=null;draw()};c.onpointercancel=c.onpointerup;$('add').onclick=()=>{if(!img)return;photos.push({id:Date.now(),image:c.toDataURL('image/jpeg',.82),comment:$('comment').value||'Sans commentaire',action:$('action').value});$('comment').value='';$('editor').style.display='none';img=null;render()};function render(){$('list').innerHTML=photos.map((v,i)=>`<div class="card"><img src="${v.image}" alt="Photo"><div><b>Photo ${i+1}</b><small>${v.comment.replace(/</g,'&lt;')}</small><small><span class="badge ${v.action==='Corrigé'?'good':'bad'}">${v.action==='Corrigé'?'✅':'⚠️'} ${v.action}</span></small></div><button class="del" data-i="${i}">Supprimer</button></div>`).join('')||'<p class="hint">Aucune photo ajoutée.</p>';$('exports').style.display=photos.length?'grid':'none';document.querySelectorAll('.del').forEach(b=>b.onclick=()=>{photos.splice(b.dataset.i,1);render()})}function info(){return{title:$('reportTitle').value||'Rapport photographique',date:$('reportDate').value||new Date().toISOString().slice(0,10)}}function safe(s){return s.replace(/[\/*?:\[\]]/g,' ').slice(0,31)}$('exportXlsx').onclick=async()=>{if(!window.ExcelJS)return alert('Module Excel indisponible. Vérifiez Internet.');let q=info(),wb=new ExcelJS.Workbook,ws=wb.addWorksheet(safe(q.date+' '+q.title));ws.mergeCells('A1:D1');ws.getCell('A1').value=q.title;ws.getCell('A1').font={bold:true,size:16,color:{argb:'FFFFFFFF'}};ws.getCell('A1').alignment={horizontal:'center'};ws.getCell('A1').fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1565C0'}};ws.getCell('A2').value='Date : '+q.date;ws.addRow([]);ws.addRow(['N°','Photo','Commentaire','Action']);ws.columns=[{width:7},{width:34},{width:50},{width:18}];let h=ws.getRow(4);h.font={bold:true,color:{argb:'FFFFFFFF'}};h.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF377CC8'}};photos.forEach((v,i)=>{let r=5+i;ws.getRow(r).height=165;ws.getCell(`A${r}`).value=i+1;ws.getCell(`C${r}`).value=v.comment;ws.getCell(`D${r}`).value=v.action;ws.getCell(`D${r}`).fill={type:'pattern',pattern:'solid',fgColor:{argb:v.action==='Corrigé'?'FFDCFCE7':'FFFEE2E2'}};ws.getCell(`D${r}`).font={bold:true,color:{argb:v.action==='Corrigé'?'FF15803D':'FFB91C1C'}};['A','B','C','D'].forEach(k=>ws.getCell(`${k}${r}`).alignment={vertical:'top',wrapText:true});let id=wb.addImage({base64:v.image,extension:'jpeg'});ws.addImage(id,{tl:{col:1,row:r-1},ext:{width:210,height:155}})});let b=await wb.xlsx.writeBuffer(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download='rapport-'+q.date+'.xlsx';document.body.appendChild(a);a.click();a.remove()};$('exportPdf').onclick=()=>{if(!window.jspdf)return alert('Module PDF indisponible. Vérifiez Internet.');let q=info(),{jsPDF}=window.jspdf,pdf=new jsPDF('p','mm','a4'),y;function head(){pdf.setFillColor(21,101,192);pdf.rect(0,0,210,32,'F');pdf.setTextColor(255);pdf.setFontSize(20);pdf.setFont('helvetica','bold');pdf.text(q.title,14,16);pdf.setFontSize(10);pdf.setFont('helvetica','normal');pdf.text('Rapport photographique • '+q.date,14,24);y=42}head();photos.forEach((v,i)=>{if(y>235){pdf.addPage();head()}pdf.setFillColor(245,247,250);pdf.roundedRect(10,y,190,57,3,3,'F');pdf.addImage(v.image,'JPEG',14,y+4,70,49);pdf.setTextColor(25);pdf.setFontSize(12);pdf.setFont('helvetica','bold');pdf.text('Photo '+(i+1),90,y+12);pdf.setFontSize(10);pdf.setFont('helvetica','normal');pdf.text(pdf.splitTextToSize(v.comment,100),90,y+20);let ok=v.action==='Corrigé';pdf.setFillColor(ok?22:220,ok?163:38,ok?60:38);pdf.roundedRect(90,y+43,35,8,2,2,'F');pdf.setTextColor(255);pdf.setFontSize(8);pdf.setFont('helvetica','bold');pdf.text((ok?'✓ ':'! ')+v.action,93,y+48.5);y+=64});let n=pdf.getNumberOfPages();for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setTextColor(100);pdf.setFontSize(8);pdf.text('Page '+i+' / '+n,170,290)}pdf.save('rapport-'+q.date+'.pdf')};window.addEventListener('pagehide',stopCamera)})();</script></body></html>
